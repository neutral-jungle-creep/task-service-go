name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"

jobs:
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fmt check
        run: task fmt:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint
        run: task lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: task tests

      - name: Check coverage threshold
        run: bash scripts/check_coverage.sh .coverage/unit.out 50 '/docs/|main\.go|/dto/|/internal/root/'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: .coverage/unit.out

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task-service-test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user -d task-service-test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Apply migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "host=127.0.0.1 port=5433 user=user password=user_password dbname=task-service-test sslmode=disable"
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.22.1 \
            -dir ./db/migrations \
            up

      - name: Run integration tests
        env:
          TEST_DB_POSTGRES_DSN: "host=127.0.0.1 port=5433 user=user password=user_password dbname=task-service-test sslmode=disable"
        run: |
          mkdir -p .coverage
          go test -tags=integration -race -count=1 -v \
            -coverprofile=.coverage/integration.out \
            -coverpkg=./internal/...,./pkg/... \
            ./tests/integration/...

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: .coverage/integration.out

  build:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        run: docker buildx build -f build/server/Dockerfile --target app -t task-service:ci --load .
      - name: Build migrate image
        run: docker buildx build -f build/server/Dockerfile --target migrate -t task-service-migrate:ci --load .

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
